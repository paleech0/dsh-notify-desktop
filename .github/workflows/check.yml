name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Windows: the plugin's host half is Windows-only (PowerShell toast) and the
    # test suite exercises that reasoning, so CI runs where it ships.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
